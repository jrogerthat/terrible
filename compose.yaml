services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: terrible
      POSTGRES_USER: terrible_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrible_user -d terrible"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: